name: Study Notes
on:
  schedule:
    - cron: '30 20 * * *'   # 02:00 IST every night, makes the next pending units
  workflow_dispatch:
    inputs:
      limit:
        description: 'How many units to make now'
        default: '10'
concurrency:
  group: study-notes
permissions:
  contents: write
jobs:
  notes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Make notes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node notes/gen.js "${{ github.event.inputs.limit || '20' }}"
      - name: Save to repo
        run: |
          git config user.name "studify-notes"
          git config user.email "notes@users.noreply.github.com"
          git add papers/notes
          if ! git diff --cached --quiet; then
            git commit -m "Study notes update"
            for i in 1 2 3 4; do
              git pull --rebase origin main && git push && break
              sleep 8
            done
          fi
