name: ICAI documents sync
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icai-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download new ICAI files
        run: python icai_sync.py
      - name: Extract MCQs from saved PDFs
        if: always()
        run: |
          pip install pypdf -q || true
          python mcq_extract.py
      - name: Save index
        if: always()
        run: |
          git config user.name "studify-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A icai-docs
          git diff --cached --quiet && exit 0
          git commit -m "ICAI documents update"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs -q || { git rebase --abort 2>/dev/null; git reset -q --hard; }
            git push && exit 0
            sleep 5
          done
          exit 1
