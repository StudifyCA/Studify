name: ICAI documents sync
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: icai-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download new ICAI files
        run: python icai_sync.py
      - name: Extract MCQs from saved PDFs
        if: always()
        run: |
          pip install pypdf -q || true
          python mcq_extract.py
      - name: Save index
        if: always()
        run: |
          git config user.name "studify-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A icai-docs
          git diff --cached --quiet || git commit -m "ICAI documents update"
          git pull --rebase -q || true
          git push
