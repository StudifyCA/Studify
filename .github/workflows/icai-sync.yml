name: ICAI documents sync
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download new ICAI files
        run: python icai_sync.py
      - name: Save changes
        if: always()
        run: |
          git config user.name "studify-bot"
          git config user.email "bot@users.noreply.github.com"
          git add icai-docs
          git diff --cached --quiet || git commit -m "ICAI documents update"
          git push
