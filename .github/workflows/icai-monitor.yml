
name: Studify ICAI Auto Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: studify-icai-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Check ICAI announcements and PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Studify
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ICAI monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/icai_monitor.py
